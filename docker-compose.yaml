#version: '3'

services:
  web:
    image: nginx
    ports:
      - 8888:80
    volumes:
      - ./_docker/nginx/conf.d/:/etc/nginx/conf.d
      - ./project/:/var/www
    container_name: nginx
    depends_on:
      - app

  app:
    build:
      context: .
      dockerfile: _docker/app/DockerFile
    volumes:
      - ./project/:/var/www
    container_name: app
    depends_on:
      - db

  db:
    image: postgres
    restart: always
    container_name: db
    environment:
      POSTGRES_DB: prev_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - 8200:5432
    shm_size: 128mb


  node:
    image: node:20
    working_dir: /var/www
    container_name: node
    volumes:
      - ./project/:/var/www
    ports:
      - 5173:5173
    command: sh -c "npm install && npm run dev -- --host"